name: Refresh listed produce weather

on:
  schedule:
    - cron: "20 21 * * 1-5"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull delayed listed quotes
        run: python3 scripts/collect_markets.py
      - name: Commit if the tape moved
        run: |
          git config user.name "bushel-bot"
          git config user.email "bushel-bot@users.noreply.github.com"
          git add src/data/markets.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "chore: listed weather refresh"
            git push
          fi
