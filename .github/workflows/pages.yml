name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Static build
        env:
          NITRO_PRESET: static
          VITE_AUTH_ENABLED: "false"
        run: |
          node scripts/with-app-env.mjs vite build || true
          test -f .output/public/index.html
          node scripts/rewrite-gh-pages.mjs
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .output/gh-pages
          branch: gh-pages
          clean: true
